# Alembic settings, for working on migrations from backend/:
#   uv run alembic history                      list the migrations
#   uv run alembic current                      which migration the database has reached
#   uv run alembic revision -m "add something"  start a new migration script
# To upgrade your database, start the backend or run `uv run python -m app.migrate`:
# both make a backup copy first.
#
# The database location comes from the app's settings (RECIPES_DATA_DIR), in migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
