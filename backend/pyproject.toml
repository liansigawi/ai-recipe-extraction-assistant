[project]
name = "recipe-notebook-backend"
version = "0.4.0"
description = "Local Recipe Notebook backend: importers, extraction, persistence, API"
# 3.14.0-3.14.6 have an asyncio bug that makes each Playwright call keep memory alive
# until the browser connection closes (cpython#152569, playwright-python#3148).
requires-python = ">=3.14.7"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.147.0",
    "httpx2>=2.14.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# This is an application, not a library we publish: uv only manages its environment.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests `import app...` when pytest runs from the backend/ directory.
pythonpath = ["."]
